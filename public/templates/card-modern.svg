<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  <rect x="40" y="40" width="920" height="520" rx="24" fill="#ffffff" opacity="0.06"/>

  <g id="Logo" transform="translate(80,120)">
    <circle cx="0" cy="0" r="60" fill="#3B82F6"/>
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <text id="Company" x="80" y="300" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">THE VENTURE</text>
  <text id="Tagline" x="80" y="348" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#93C5FD">Where Ideas Become Impact</text>

  <g transform="translate(80, 400)" font-family="Inter, Arial, sans-serif" font-size="22" fill="#E5E7EB">
    <text id="Name" x="0" y="0" font-weight="600">Jane Doe</text>
    <text id="Title" x="0" y="34">Product Designer</text>
    <text id="Email" x="0" y="68">jane@example.com</text>
    <text id="Phone" x="0" y="102">+1 (555) 010-1234</text>
    <text id="Website" x="0" y="136">www.example.com</text>
  </g>

  <g transform="translate(700, 120)" font-family="Inter, Arial, sans-serif" fill="#93C5FD">
    <text font-size="16" opacity="0.7">Business Card Template • Modern</text>
  </g>
</svg>

