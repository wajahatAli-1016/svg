<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="#FFFFFF"/>
  <rect x="40" y="40" width="920" height="520" rx="24" fill="#111827"/>

  <g id="Logo" transform="translate(820,110)">
    <rect x="-60" y="-60" width="120" height="120" rx="16" fill="#111827" stroke="#F59E0B" stroke-width="6"/>
    <circle cx="0" cy="0" r="34" fill="#F59E0B"/>
  </g>

  <text id="Company" x="80" y="170" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#F9FAFB">ACME STUDIO</text>
  <text id="Tagline" x="80" y="214" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#D1D5DB">Simple. Clean. Focused.</text>

  <g transform="translate(80, 300)" font-family="Inter, Arial, sans-serif" font-size="22" fill="#E5E7EB">
